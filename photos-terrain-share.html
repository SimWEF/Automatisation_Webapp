<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0b5cad">
<title>Photos Terrain</title>
<style>
  :root{
    --bleu:#0b5cad;
    --bleu-fonce:#083f78;
    --vert:#1f9d55;
    --rouge:#d93838;
    --gris:#f2f4f7;
    --gris-bord:#d0d7de;
    --texte:#1a1a1a;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{
    font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--gris); color:var(--texte);
    font-size:18px; line-height:1.4; padding:0 0 40px;
  }
  header{
    background:var(--bleu); color:#fff; padding:18px 16px;
    text-align:center; font-size:22px; font-weight:700;
    position:sticky; top:0; z-index:10; box-shadow:0 2px 6px rgba(0,0,0,.15);
  }
  .container{ max-width:520px; margin:0 auto; padding:16px; }
  .card{
    background:#fff; border:1px solid var(--gris-bord); border-radius:14px;
    padding:16px; margin-bottom:16px; box-shadow:0 1px 3px rgba(0,0,0,.06);
  }
  label{ display:block; font-weight:600; margin-bottom:8px; font-size:16px; }
  input[type=file]{ display:none; }
  .btn{
    display:flex; align-items:center; justify-content:center; gap:10px;
    width:100%; padding:20px; font-size:20px; font-weight:700;
    border:none; border-radius:14px; cursor:pointer; text-align:center;
    margin-top:4px; user-select:none; -webkit-user-select:none;
    transition:transform .05s ease, opacity .2s ease;
  }
  .btn:active{ transform:scale(.98); }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }
  .btn-photo{ background:var(--bleu); color:#fff; }
  .btn-send { background:var(--vert); color:#fff; }
  .btn-reset{ background:#fff; color:var(--rouge); border:2px solid var(--rouge); }

  #galerie{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:14px; }
  .vignette{ position:relative; border-radius:10px; overflow:hidden; border:1px solid var(--gris-bord); aspect-ratio:1/1; }
  .vignette img{ width:100%; height:100%; object-fit:cover; display:block; }
  .vignette .suppr{
    position:absolute; top:4px; right:4px; width:28px; height:28px;
    background:rgba(217,56,56,.92); color:#fff; border:none; border-radius:50%;
    font-size:16px; font-weight:700; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .vignette .num{
    position:absolute; bottom:0; left:0; right:0;
    background:rgba(0,0,0,.55); color:#fff; font-size:12px; text-align:center; padding:2px 0;
  }
  .compteur{ font-size:15px; color:#5a6673; text-align:center; margin-top:10px; }

  textarea{
    width:100%; min-height:70px; font-size:18px; padding:12px;
    border:1px solid var(--gris-bord); border-radius:10px; resize:vertical; font-family:inherit;
  }
  .status{
    text-align:center; font-size:16px; font-weight:600; padding:14px;
    border-radius:12px; margin-top:4px; display:none;
  }
  .status.info  { display:block; background:#e7f0fb; color:var(--bleu-fonce); }
  .status.ok    { display:block; background:#e4f6ec; color:var(--vert); }
  .status.erreur{ display:block; background:#fdecec; color:var(--rouge); }
</style>
</head>
<body>

<header>📷 Photos Terrain</header>

<div class="container">

  <!-- 1. PRISE DE PHOTOS -->
  <div class="card">
    <label for="photo">1. Ajouter des photos</label>
    <input type="file" accept="image/*" multiple id="photo">
    <label for="photo" class="btn btn-photo">📸 Prendre / ajouter des photos</label>
    <div id="galerie"></div>
    <div class="compteur" id="compteur"></div>
  </div>

  <!-- 2. COMMENTAIRE -->
  <div class="card">
    <label for="commentaire">2. Commentaire / n° équipement</label>
    <textarea id="commentaire" placeholder="Ex : EQ-1254 — tube détérioré faisceau nord"></textarea>
  </div>

  <!-- 3. ENVOI -->
  <div class="card">
    <label>3. Envoyer</label>
    <button id="sendBtn" class="btn btn-send" disabled>Envoyer 📤</button>
    <button id="resetBtn" class="btn btn-reset" style="margin-top:10px; display:none;">Tout effacer 🗑️</button>
    <div id="status" class="status"></div>
  </div>

</div>

<script>
/* ============================================================
   POC — Envoi de photos via navigator.share()
   ------------------------------------------------------------
   Aucune licence, aucune clé API, aucune dépendance externe.
   Le clic sur "Envoyer" ouvre le menu de partage natif du
   téléphone (Outlook, Gmail, Teams, OneDrive...) avec les
   photos déjà jointes. L'utilisateur choisit la destination
   et confirme l'envoi.
   ============================================================ */

// Destinataire pré-rempli dans le corps du partage (facultatif — voir plus bas)
const DESTINATAIRE = "photos-terrain@tasociete.fr";

// Les photos originales sont conservées (pas de compression pour le POC).
let photos = [];   // { file, url }

const photoInput = document.getElementById('photo');
const galerie    = document.getElementById('galerie');
const compteur   = document.getElementById('compteur');
const sendBtn    = document.getElementById('sendBtn');
const resetBtn   = document.getElementById('resetBtn');
const status     = document.getElementById('status');
const commentaire= document.getElementById('commentaire');

function setStatus(type, msg){ status.className = "status " + type; status.innerHTML = msg; }
function clearStatus(){ status.className = "status"; status.innerHTML = ""; }

/* ---------- Ajout de photos ---------- */
photoInput.addEventListener('change', e => {
  const fichiers = Array.from(e.target.files);
  fichiers.forEach(f => {
    // On renomme proprement pour la pièce jointe
    const nom = `photo_${photos.length + 1}_${Date.now()}.jpg`;
    const file = new File([f], nom, { type: f.type || 'image/jpeg' });
    photos.push({ file, url: URL.createObjectURL(file) });
  });
  photoInput.value = "";   // permet de re-sélectionner les mêmes fichiers
  clearStatus();
  rendreGalerie();
});

/* ---------- Affichage de la galerie ---------- */
function rendreGalerie(){
  galerie.innerHTML = "";
  photos.forEach((p, i) => {
    const div = document.createElement('div');
    div.className = 'vignette';
    div.innerHTML = `
      <img src="${p.url}" alt="photo ${i+1}">
      <div class="num">${i+1}</div>
      <button class="suppr" data-i="${i}" aria-label="Supprimer">×</button>`;
    galerie.appendChild(div);
  });

  galerie.querySelectorAll('.suppr').forEach(btn => {
    btn.addEventListener('click', () => {
      const i = +btn.dataset.i;
      URL.revokeObjectURL(photos[i].url);
      photos.splice(i, 1);
      rendreGalerie();
    });
  });

  const total = photos.reduce((s, p) => s + p.file.size, 0);
  const totalMo = (total / (1024*1024)).toFixed(1);
  compteur.textContent = photos.length
    ? `${photos.length} photo(s) · ~${totalMo} Mo`
    : "";

  sendBtn.disabled = photos.length === 0;
  resetBtn.style.display = photos.length ? 'flex' : 'none';
}

/* ---------- Envoi via navigator.share() ---------- */
sendBtn.addEventListener('click', async () => {
  if (!photos.length){ setStatus('erreur', "⚠️ Ajoute d'abord des photos."); return; }

  const files = photos.map(p => p.file);
  const texte =
      `Destinataire suggéré : ${DESTINATAIRE}\n` +
      `Date : ${new Date().toLocaleString('fr-FR')}\n` +
      `Commentaire : ${commentaire.value.trim() || 'RAS'}`;

  // 1) Vérifie que le partage de FICHIERS est supporté
  if (navigator.canShare && navigator.canShare({ files })){
    try{
      await navigator.share({
        title: "Photo terrain",
        text: texte,
        files: files
      });
      setStatus('ok', "✅ Partage lancé. Choisis Outlook / Gmail puis envoie.");
    }catch(err){
      // L'utilisateur a annulé, ou erreur
      if (err && err.name === 'AbortError'){
        setStatus('info', "Partage annulé.");
      }else{
        console.error(err);
        setStatus('erreur', "❌ Partage impossible : " + (err.message || err));
      }
    }
    return;
  }

  // 2) Repli : appareil qui ne supporte pas le partage de fichiers
  //    -> ouvre un brouillon d'e-mail (sans pièce jointe, limite du navigateur)
  setStatus('erreur',
    "⚠️ Le partage de fichiers n'est pas supporté par ce navigateur.<br>" +
    "Sur ordinateur, utilise plutôt un téléphone Android + Chrome, " +
    "ou la version EmailJS/Web3Forms.");
});

/* ---------- Tout effacer ---------- */
resetBtn.addEventListener('click', () => {
  photos.forEach(p => URL.revokeObjectURL(p.url));
  photos = [];
  commentaire.value = "";
  clearStatus();
  rendreGalerie();
});
</script>
</body>
</html>
