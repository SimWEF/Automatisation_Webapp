<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Envoyer des photos — PIGVS</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Styles spécifiques à l'onglet photos (complètent style.css) */
    .adresse-bloc {
      display:flex; align-items:center; gap:10px;
      background:#f2f4f7; border:1px dashed #0078D7;
      border-radius:12px; padding:12px;
    }
    .adresse-bloc .mail {
      flex:1; font-family:monospace; font-size:15px; font-weight:bold;
      color:#083f78; word-break:break-all;
    }
    .btn-copy {
      background:#0078D7; color:#fff; border:none; border-radius:10px;
      padding:12px 16px; font-size:14px; font-weight:bold; cursor:pointer; white-space:nowrap;
    }
    .btn-photo {
      display:flex; align-items:center; justify-content:center; gap:10px;
      width:100%; padding:18px; font-size:18px; font-weight:bold;
      border:none; border-radius:12px; cursor:pointer;
      background:#0078D7; color:#fff;
    }
    .btn-send {
      display:flex; align-items:center; justify-content:center; gap:10px;
      width:100%; padding:18px; font-size:18px; font-weight:bold;
      border:none; border-radius:12px; cursor:pointer;
      background:#1f9d55; color:#fff;
    }
    .btn-send:disabled { opacity:.5; }
    .btn-reset {
      width:100%; padding:14px; font-size:15px; font-weight:bold;
      border:2px solid #d93838; border-radius:12px; cursor:pointer;
      background:#fff; color:#d93838; margin-top:10px;
    }
    #photoInput { display:none; }
    textarea { width:100%; min-height:80px; padding:12px; font-size:16px;
               border-radius:8px; border:1px solid #ccc; box-sizing:border-box; resize:none; }
    .card > label { display:block; font-weight:bold; margin-bottom:8px; font-size:15px; }
    #galerie { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:14px; }
    .vignette { position:relative; border-radius:10px; overflow:hidden; border:1px solid #d0d7de; aspect-ratio:1/1; }
    .vignette img { width:100%; height:100%; object-fit:cover; display:block; }
    .vignette .suppr {
      position:absolute; top:4px; right:4px; width:26px; height:26px;
      background:rgba(217,56,56,.92); color:#fff; border:none; border-radius:50%;
      font-size:15px; font-weight:bold; cursor:pointer;
    }
    .vignette .num {
      position:absolute; bottom:0; left:0; right:0;
      background:rgba(0,0,0,.55); color:#fff; font-size:12px; text-align:center; padding:2px 0;
    }
    .compteur { font-size:14px; color:var(--muted,#5a6673); text-align:center; margin-top:10px; }
    .status { text-align:center; font-size:15px; font-weight:bold; padding:14px; border-radius:12px; margin-top:4px; display:none; }
    .status.info  { display:block; background:#e7f0fb; color:#083f78; }
    .status.ok    { display:block; background:#e4f6ec; color:#1f9d55; }
    .status.erreur{ display:block; background:#fdecec; color:#d93838; }
    .back-link { display:inline-block; margin:10px 0; text-decoration:none; color:#0078D7; font-weight:bold; }
  </style>
</head>
<body>
  <header class="app-header">
    <h1>📷 Envoyer des photos</h1>
  </header>

  <div class="container">
    <a class="back-link" href="index.html">← Retour à l'accueil</a>

    <div class="card">
      <label>📧 Adresse de destination</label>
      <div class="adresse-bloc">
        <span class="mail" id="mailDest">photos-terrain@tasociete.fr</span>
        <button class="btn-copy" id="copyBtn">Copier</button>
      </div>
      <div class="compteur">Colle cette adresse dans le champ « À » de ton mail.</div>
    </div>

    <div class="card">
      <label for="photoInput">1. Ajouter des photos</label>
      <input type="file" accept="image/*" multiple id="photoInput">
      <label for="photoInput" class="btn-photo">📸 Prendre / ajouter des photos</label>
      <div id="galerie"></div>
      <div class="compteur" id="compteur"></div>
    </div>

    <div class="card">
      <label for="commentairePhoto">2. Commentaire / n° équipement</label>
      <textarea id="commentairePhoto" placeholder="Ex : EQ-1254 — tube détérioré faisceau nord"></textarea>
    </div>

    <div class="card">
      <label>3. Envoyer</label>
      <button id="sendBtn" class="btn-send" disabled>Envoyer 📤</button>
      <button id="resetBtn" class="btn-reset" style="display:none;">Tout effacer 🗑️</button>
      <div id="statusPhoto" class="status"></div>
    </div>
  </div>

<script>
/* =========================================================
   ENVOYER DES PHOTOS via navigator.share()
   ========================================================= */
const DESTINATAIRE = "souarns@westinghouse.com"; // <-- mets ton adresse ici

document.getElementById('mailDest').textContent = DESTINATAIRE;

let photos = [];   // { file, url }

const photoInput  = document.getElementById('photoInput');
const galerie     = document.getElementById('galerie');
const compteur    = document.getElementById('compteur');
const sendBtn     = document.getElementById('sendBtn');
const resetBtn    = document.getElementById('resetBtn');
const statusPhoto = document.getElementById('statusPhoto');
const commentairePhoto = document.getElementById('commentairePhoto');
const copyBtn     = document.getElementById('copyBtn');

function setStatusP(t,m){ statusPhoto.className="status "+t; statusPhoto.innerHTML=m; }
function clearStatusP(){ statusPhoto.className="status"; statusPhoto.innerHTML=""; }

/* Copier l'adresse */
copyBtn.addEventListener('click', async ()=>{
  try{
    await navigator.clipboard.writeText(DESTINATAIRE);
  }catch(err){
    const tmp=document.createElement('textarea');
    tmp.value=DESTINATAIRE; document.body.appendChild(tmp);
    tmp.select(); document.execCommand('copy'); tmp.remove();
  }
  copyBtn.textContent = "Copié ✅";
  setTimeout(()=>copyBtn.textContent="Copier", 1800);
});

/* Ajout de photos */
photoInput.addEventListener('change', e=>{
  const fichiers=Array.from(e.target.files);
  fichiers.forEach(f=>{
    const nom=`photo_${photos.length+1}_${Date.now()}.jpg`;
    const file=new File([f], nom, {type:f.type||'image/jpeg'});
    photos.push({file, url:URL.createObjectURL(file)});
  });
  photoInput.value="";
  clearStatusP();
  rendreGalerie();
});

/* Galerie */
function rendreGalerie(){
  galerie.innerHTML="";
  photos.forEach((p,i)=>{
    const div=document.createElement('div');
    div.className='vignette';
    div.innerHTML=`<img src="${p.url}" alt="photo ${i+1}">
      <div class="num">${i+1}</div>
      <button class="suppr" data-i="${i}" aria-label="Supprimer">×</button>`;
    galerie.appendChild(div);
  });
  galerie.querySelectorAll('.suppr').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const i=+btn.dataset.i;
      URL.revokeObjectURL(photos[i].url);
      photos.splice(i,1);
      rendreGalerie();
    });
  });
  const total=photos.reduce((s,p)=>s+p.file.size,0);
  compteur.textContent=photos.length?`${photos.length} photo(s) · ~${(total/1048576).toFixed(1)} Mo`:"";
  sendBtn.disabled=photos.length===0;
  resetBtn.style.display=photos.length?'block':'none';
}

/* Envoi via navigator.share() */
sendBtn.addEventListener('click', async ()=>{
  if(!photos.length){ setStatusP('erreur',"⚠️ Ajoute d'abord des photos."); return; }

  const files=photos.map(p=>p.file);
  const texte=
    `#PHOTOTERRAIN#\n`+
    `Envoyer à : ${DESTINATAIRE}\n`+
    `Date : ${new Date().toLocaleString('fr-FR')}\n`+
    `Commentaire : ${commentairePhoto.value.trim()||'RAS'}`;

  if(navigator.canShare && navigator.canShare({files})){
    try{
      await navigator.share({ title:"Photo terrain", text:texte, files:files });
      setStatusP('ok',"✅ Partage lancé. Choisis Outlook/Gmail, colle l'adresse puis envoie.");
    }catch(err){
      if(err && err.name==='AbortError'){ setStatusP('info',"Partage annulé."); }
      else{ console.error(err); setStatusP('erreur',"❌ Partage impossible : "+(err.message||err)); }
    }
    return;
  }

  setStatusP('erreur',
    "⚠️ Le partage de fichiers n'est pas supporté ici.<br>"+
    "Teste depuis un téléphone Android + Chrome (en HTTPS).");
});

/* Tout effacer */
resetBtn.addEventListener('click',()=>{
  photos.forEach(p=>URL.revokeObjectURL(p.url));
  photos=[]; commentairePhoto.value=""; clearStatusP(); rendreGalerie();
});
</script>
</body>
</html>
