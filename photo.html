<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo — PIGVS</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .adresse-bloc { display:flex; align-items:center; gap:10px; background:#f2f4f7;
      border:1px dashed #0078D7; border-radius:12px; padding:12px; }
    .adresse-bloc .mail { flex:1; font-family:monospace; font-size:14px; font-weight:bold;
      color:#083f78; word-break:break-all; }
    .btn-copy { background:#0078D7; color:#fff; border:none; border-radius:10px;
      padding:12px 16px; font-size:14px; font-weight:bold; cursor:pointer; white-space:nowrap; }
    .btn-photo { display:flex; align-items:center; justify-content:center; gap:10px; width:100%;
      padding:18px; font-size:18px; font-weight:bold; border:none; border-radius:12px; cursor:pointer;
      background:#0078D7; color:#fff; }
    .btn-send { display:flex; align-items:center; justify-content:center; gap:10px; width:100%;
      padding:18px; font-size:18px; font-weight:bold; border:none; border-radius:12px; cursor:pointer;
      background:#1f9d55; color:#fff; }
    .btn-send:disabled { opacity:.5; }
    .btn-reset { width:100%; padding:14px; font-size:15px; font-weight:bold; border:2px solid #d93838;
      border-radius:12px; cursor:pointer; background:#fff; color:#d93838; margin-top:10px; }
    /* Input masqué hors écran (PAS display:none) pour que 'change' se déclenche,
       le <label> ouvre le sélecteur (fiable sur WebView Android) */
    #photoInput { position:absolute; width:1px; height:1px; padding:0; margin:-1px;
      overflow:hidden; clip:rect(0,0,0,0); border:0; }
    .champ { margin-bottom:12px; }
    .champ label { display:block; font-weight:bold; margin-bottom:6px; font-size:15px; }
    .champ .req { color:#d93838; }
    input, select, textarea { width:100%; padding:12px; font-size:16px; border-radius:8px;
      border:1px solid #ccc; box-sizing:border-box; }
    textarea { min-height:70px; resize:none; }
    .card > label { display:block; font-weight:bold; margin-bottom:8px; font-size:15px; }
    #galerie { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:14px; }
    .vignette { position:relative; border-radius:10px; overflow:hidden; border:1px solid #d0d7de; aspect-ratio:1/1; }
    .vignette img { width:100%; height:100%; object-fit:cover; display:block; }
    .vignette .suppr { position:absolute; top:4px; right:4px; width:26px; height:26px;
      background:rgba(217,56,56,.92); color:#fff; border:none; border-radius:50%;
      font-size:15px; font-weight:bold; cursor:pointer; }
    .vignette .num { position:absolute; bottom:0; left:0; right:0; background:rgba(0,0,0,.55);
      color:#fff; font-size:12px; text-align:center; padding:2px 0; }
    .compteur { font-size:14px; color:var(--muted,#5a6673); text-align:center; margin-top:10px; }
    .chemin { font-size:12px; font-family:monospace; color:#083f78; background:#eef4fb;
      border-radius:8px; padding:8px; margin-top:10px; word-break:break-all; }
    .status { text-align:center; font-size:15px; font-weight:bold; padding:14px; border-radius:12px; margin-top:4px; display:none; }
    .status.info  { display:block; background:#e7f0fb; color:#083f78; }
    .status.ok    { display:block; background:#e4f6ec; color:#1f9d55; }
    .status.erreur{ display:block; background:#fdecec; color:#d93838; }
  </style>
</head>
<body>
  <header class="app-header">
    <a class="back" href="photos.html">‹</a>
    <h1 id="titrePage">📷 Photo</h1>
  </header>
  <div class="container">
    <!-- Adresse de destination -->
    <div class="card">
      <label>📧 Adresse de destination</label>
      <div class="adresse-bloc">
        <span class="mail" id="mailDest">photos-terrain@tasociete.fr</span>
        <button class="btn-copy" id="copyBtn">Copier</button>
      </div>
      <div class="compteur">Colle cette adresse dans le champ « À » de ton mail.</div>
    </div>
    <!-- Paramètres (générés dynamiquement) -->
    <div class="card">
      <label>1. Renseigner les informations</label>
      <div id="champs"></div>
    </div>
    <!-- Photos -->
    <div class="card">
      <label>2. Ajouter des photos</label>
      <input type="file" accept="image/*" multiple id="photoInput">
      <label for="photoInput" class="btn-photo">📸 Prendre / ajouter des photos</label>
      <div id="galerie"></div>
      <div class="compteur" id="compteur"></div>
    </div>
    <!-- Envoi -->
    <div class="card">
      <label>3. Envoyer</label>
      <div class="chemin" id="apercuChemin">Destination : …</div>
      <button id="sendBtn" class="btn-send" style="margin-top:10px" disabled>Envoyer 📤</button>
      <button id="resetBtn" class="btn-reset" style="display:none;">Tout effacer 🗑️</button>
      <div id="statusPhoto" class="status"></div>
    </div>
  </div>
<script>
/* =========================================================
   CONFIGURATION GÉNÉRALE
   ========================================================= */
const DESTINATAIRE = "souarns@westinghouse.com"; // <-- ton adresse dédiée

const TYPES = {
  "colisage-conteneur": {
    titre:"📦 Colisage conteneur",
    champs:[
      {id:"site",      label:"Site",            type:"json",  source:"Sites.json",      req:true},
      {id:"conteneur", label:"Conteneur",       type:"json",  source:"Conteneurs.json", req:true},
      {id:"nom",       label:"Nom de la photo", type:"text",  req:false}
    ],
    path:v=>`photo-PIGVS/${v.site}/Colisage conteneur/${v.conteneur}`,
    fichier:v=>v.nom||""
  },
  "colisage-caisse": {
    titre:"🧰 Colisage caisse",
    champs:[
      {id:"site",   label:"Site",            type:"json", source:"Sites.json",   req:true},
      {id:"caisse", label:"Caisse",          type:"json", source:"Caisses.json", req:true},
      {id:"nom",    label:"Nom de la photo", type:"text", req:false}
    ],
    path:v=>`photo-PIGVS/${v.site}/Colisage caisse/${v.caisse}`,
    fichier:v=>v.nom||""
  },
  "cahier-quart": {
    titre:"📓 Cahier de quart",
    champs:[
      {id:"site",     label:"Site",     type:"json",  source:"Sites.json", req:true},
      {id:"gv",       label:"GV",       type:"liste", options:["GV1","GV2","GV3","GV4"], req:true},
      {id:"activite", label:"Activité", type:"liste", options:["lançage","ETV"], req:true},
      {id:"date",     label:"Date",     type:"date",  req:true},
      {id:"poste",    label:"Poste",    type:"liste", options:["Matin","Après-midi","Nuit","Journée"], req:true}
    ],
    path:v=>`photo-PIGVS/${v.site}/Cahier de quart/${v.gv}/${v.activite}`,
    fichier:v=>`${v.date}_${v.poste}`
  },
  "portee-joint": {
    titre:"🔩 Portée de joint",
    champs:[
      {id:"site", label:"Site",            type:"json",  source:"Sites.json", req:true},
      {id:"gv",   label:"GV",              type:"liste", options:["GV1","GV2","GV3","GV4"], req:true},
      {id:"sens", label:"Entrée / Sortie", type:"liste", options:["Entrée","Sortie"], req:true},
      {id:"nom",  label:"Nom de la photo", type:"text",  req:false}
    ],
    path:v=>`photo-PIGVS/${v.site}/Portées de joint/${v.gv}/${v.sens}`,
    fichier:v=>v.nom||""
  },
  "condition-acces": {
    titre:"🚪 Condition d'accès",
    champs:[
      {id:"site",        label:"Site",            type:"json",     source:"Sites.json", req:true},
      {id:"commentaire", label:"Commentaire",     type:"textarea", req:false},
      {id:"nom",         label:"Nom de la photo", type:"text",     req:false}
    ],
    path:v=>`photo-PIGVS/${v.site}/Conditions d'accès`,
    fichier:v=>v.nom||""
  },
  "autre": {
    titre:"🗂️ Autre",
    champs:[
      {id:"site",        label:"Site",            type:"json",     source:"Sites.json", req:true},
      {id:"commentaire", label:"Commentaire",     type:"textarea", req:false},
      {id:"nom",         label:"Nom de la photo", type:"text",     req:false}
    ],
    path:v=>`photo-PIGVS/${v.site}/Autre`,
    fichier:v=>v.nom||""
  }
};

/* =========================================================
   RÉFÉRENCES DOM (déclarées AVANT toute utilisation)
   ========================================================= */
const params = new URLSearchParams(location.search);
const TYPE_ID = params.get('type');
const TYPE = TYPES[TYPE_ID];

const champsDiv    = document.getElementById('champs');
const titrePage    = document.getElementById('titrePage');
const apercuChemin = document.getElementById('apercuChemin');

let photos = [];
const photoInput = document.getElementById('photoInput');
const galerie    = document.getElementById('galerie');
const compteur   = document.getElementById('compteur');
const sendBtn    = document.getElementById('sendBtn');
const resetBtn   = document.getElementById('resetBtn');
const statusPhoto= document.getElementById('statusPhoto');
const copyBtn    = document.getElementById('copyBtn');

document.getElementById('mailDest').textContent = DESTINATAIRE;

/* =========================================================
   FONCTIONS UTILITAIRES
   ========================================================= */
function clean(s){ return (s||'').toString().trim().replace(/[\\\/:*?"<>|#]/g,'-'); }

function setStatusP(t,m){ statusPhoto.className="status "+t; statusPhoto.innerHTML=m; }
function clearStatusP(){ statusPhoto.className="status"; statusPhoto.innerHTML=""; }

/* =========================================================
   CONSTRUCTION DES CHAMPS
   ========================================================= */
function construireChamps(){
  TYPE.champs.forEach(c=>{
    const wrap=document.createElement('div');
    wrap.className='champ';
    const req = c.req ? ' <span class="req">*</span>' : '';
    let inner = `<label for="f_${c.id}">${c.label}${req}</label>`;
    if(c.type==='json'){
      inner += `<select id="f_${c.id}"><option value="">— choisir —</option></select>`;
    } else if(c.type==='liste'){
      inner += `<select id="f_${c.id}"><option value="">— choisir —</option>` +
        c.options.map(o=>`<option value="${o}">${o}</option>`).join('') + `</select>`;
    } else if(c.type==='date'){
      inner += `<input type="date" id="f_${c.id}">`;
    } else if(c.type==='textarea'){
      inner += `<textarea id="f_${c.id}"></textarea>`;
    } else {
      inner += `<input type="text" id="f_${c.id}">`;
    }
    wrap.innerHTML = inner;
    champsDiv.appendChild(wrap);
  });

  TYPE.champs.forEach(c=>{
    const el=document.getElementById('f_'+c.id);
    if(c.type==='json'){
      fetch(c.source).then(r=>r.json()).then(list=>{
        list.forEach(item=>{
          const o=document.createElement('option'); o.value=item; o.textContent=item; el.appendChild(o);
        });
      }).catch(()=>{ el.innerHTML='<option value="">⚠️ '+c.source+' introuvable</option>'; });
    }
    if(c.type==='date'){ el.value = new Date().toISOString().slice(0,10); }
    el.addEventListener('input', majEtat);
    el.addEventListener('change', majEtat);
  });
  majEtat();
}

function lireValeurs(){
  const v={};
  TYPE.champs.forEach(c=>{
    const el=document.getElementById('f_'+c.id);
    v[c.id] = c.type==='textarea' ? (el.value||'') : clean(el.value);
  });
  return v;
}

function champsOK(){
  return TYPE.champs.every(c=>{
    if(!c.req) return true;
    return document.getElementById('f_'+c.id).value.trim() !== '';
  });
}

/* =========================================================
   PHOTOS
   ========================================================= */
copyBtn.addEventListener('click', async ()=>{
  try{ await navigator.clipboard.writeText(DESTINATAIRE); }
  catch(err){ const t=document.createElement('textarea'); t.value=DESTINATAIRE;
    document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }
  copyBtn.textContent="Copié ✅"; setTimeout(()=>copyBtn.textContent="Copier",1800);
});

photoInput.addEventListener('change', e=>{
  const fichiers = Array.from(e.target.files || []);
  if(!fichiers.length){ setStatusP('erreur',"⚠️ Aucune photo reçue. Réessaie."); return; }
  fichiers.forEach(f=>{
    photos.push({ file:f, url:URL.createObjectURL(f) });
  });
  clearStatusP();
  setStatusP('info', fichiers.length+" photo(s) ajoutée(s).");
  rendreGalerie();
});

function rendreGalerie(){
  galerie.innerHTML="";
  photos.forEach((p,i)=>{
    const div=document.createElement('div'); div.className='vignette';
    div.innerHTML=`<img src="${p.url}"><div class="num">${i+1}</div>
      <button class="suppr" data-i="${i}">×</button>`;
    galerie.appendChild(div);
  });
  galerie.querySelectorAll('.suppr').forEach(b=>b.addEventListener('click',()=>{
    const i=+b.dataset.i; URL.revokeObjectURL(photos[i].url); photos.splice(i,1); rendreGalerie();
  }));
  const total=photos.reduce((s,p)=>s+p.file.size,0);
  compteur.textContent = photos.length ? `${photos.length} photo(s) · ~${(total/1048576).toFixed(1)} Mo` : "";
  resetBtn.style.display = photos.length ? 'block':'none';
  majEtat();
}

function majEtat(){
  if(!TYPE) return;
  const v=lireValeurs();
  let chemin="…";
  try{ chemin = TYPE.path(v); }catch(e){}
  apercuChemin.textContent = "Destination : /"+chemin;
  sendBtn.disabled = !(photos.length>0 && champsOK());
}

/* =========================================================
   ENVOI via navigator.share()
   ========================================================= */
sendBtn.addEventListener('click', async ()=>{
  if(!photos.length){ setStatusP('erreur',"⚠️ Ajoute d'abord des photos."); return; }
  if(!champsOK()){ setStatusP('erreur',"⚠️ Remplis les champs obligatoires (*)."); return; }

  const v = lireValeurs();
  const chemin  = TYPE.path(v);
  const fichier = clean(TYPE.fichier(v));

  const recap = TYPE.champs.map(c=>{
    const el=document.getElementById('f_'+c.id);
    return `${c.label}: ${(el.value||'').replace(/#/g,'')}`;
  }).join('\n');

  const texte =
`#PHOTOPIGVS#
#PATH:${chemin}#
#FILE:${fichier}#
Type: ${TYPE.titre}
${recap}
Envoi: ${new Date().toLocaleString('fr-FR')}`;

  const files = photos.map(p=>p.file);

  if(navigator.canShare && navigator.canShare({files})){
    try{
      await navigator.share({ title:"Photo PIGVS", text:texte, files:files });
      setStatusP('ok',"✅ Partage lancé. Choisis Outlook/Gmail, colle l'adresse puis envoie.");
    }catch(err){
      if(err && err.name==='AbortError'){ setStatusP('info',"Partage annulé."); }
      else{ console.error(err); setStatusP('erreur',"❌ Partage impossible : "+(err.message||err)); }
    }
    return;
  }
  setStatusP('erreur',"⚠️ Partage de fichiers non supporté ici.<br>Teste sur Android + Chrome (HTTPS).");
});

resetBtn.addEventListener('click',()=>{
  photos.forEach(p=>URL.revokeObjectURL(p.url));
  photos=[]; clearStatusP(); rendreGalerie();
});

/* =========================================================
   INITIALISATION (tout en bas, une fois TOUT déclaré)
   ========================================================= */
if(!TYPE){
  titrePage.textContent = "⚠️ Type inconnu";
  champsDiv.innerHTML = "<p style='color:#d93838'>Type de photo non reconnu. Reviens au menu Photos.</p>";
} else {
  titrePage.textContent = TYPE.titre;
  construireChamps();
}
</script>
</body>
</html>
